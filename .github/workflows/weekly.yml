name: Weekly ledger

# GitHub runs schedules in UTC and may start them late or, at busy times such as the top of the hour, drop them.
# So there are seven attempts, away from the full hour: 13:07 and 14:07 UTC (one of them is 9:07 a.m. US Eastern in
# summer, the other in winter), then 15:23, 17:41, 19:53, 22:17 UTC and 01:37 UTC on Tuesday (still Monday evening
# in US Eastern time). On 12 and 19 October 2026 GitHub started none of the first three on time. scripts/run.py
# writes only the first run that is due (Monday, 9:00 a.m. ET or later) and skips the others. If GitHub misses all three, start the workflow by
# hand with "catch-up" ticked: the run is stamped with its own time and labelled as a catch-up on the page.
on:
  schedule:
    - cron: "7 13 * * 1"
    - cron: "7 14 * * 1"
    - cron: "23 15 * * 1"
    - cron: "41 17 * * 1"
    - cron: "53 19 * * 1"
    - cron: "17 22 * * 1"
    - cron: "37 1 * * 2"
  workflow_dispatch:
    inputs:
      catchup:
        description: "Catch-up: GitHub missed this Monday's schedule (counts as this week's run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 xlrd==2.0.1
      - name: Fetch, evaluate, write
        env:
          CATCHUP: ${{ inputs.catchup }}
        run: python scripts/run.py
      - name: Commit
        if: always()
        run: |
          git config user.name "promise-ledger bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git commit -m "Weekly run $(TZ=America/New_York date +%F)" || echo "nothing to commit"
          git push

name: Weekly ledger

# GitHub runs schedules in UTC and may start them late or, at busy times such as the top of the hour, drop them.
# On 12, 19 and 26 October 2026 none of GitHub's Monday schedules started on time. So there are two timers:
# 1. A scheduled function on Netlify (netlify/functions/weekly-dispatch.mjs) starts this workflow with "external"
#    ticked on Mondays at 13:11 and 14:11 UTC (one of them is 9:11 a.m. US Eastern in summer, the other in winter).
#    It needs a token, GITHUB_DISPATCH_TOKEN, set in Netlify's environment (see README).
#    The page labels such a run "external schedule".
# 2. GitHub's own schedule stays as the fallback: seven attempts, away from the full hour: 13:07 and 14:07 UTC,
#    then 15:23, 17:41, 19:53, 22:17 UTC and 01:37 UTC on Tuesday (still Monday evening in US Eastern time).
# scripts/run.py writes only the first run that is due (Monday, 9:00 a.m. ET or later) and skips all later ones,
# whichever timer started them; a run started too early or on another day ends without writing. If both timers miss,
# start the workflow by hand with "catch-up" ticked: the run is stamped with its own time and labelled as a catch-up.
on:
  schedule:
    - cron: "7 13 * * 1"
    - cron: "7 14 * * 1"
    - cron: "23 15 * * 1"
    - cron: "41 17 * * 1"
    - cron: "53 19 * * 1"
    - cron: "17 22 * * 1"
    - cron: "37 1 * * 2"
  workflow_dispatch:
    inputs:
      catchup:
        description: "Catch-up: GitHub missed this Monday's schedule (counts as this week's run)"
        type: boolean
        default: false
      external:
        description: "Started by the Netlify timer (counts as this week's run only on a Monday from 9:00 a.m. ET)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch as it is when this job starts, not when it was queued: a run waiting behind another
          # (see concurrency) must see the history.jsonl line that run wrote, or both would write this Monday.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 xlrd==2.0.1
      - name: Fetch, evaluate, write
        env:
          CATCHUP: ${{ inputs.catchup }}
          EXTERNAL: ${{ inputs.external }}
        run: python scripts/run.py
      - name: Commit
        if: always()
        run: |
          git config user.name "promise-ledger bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git commit -m "Weekly run $(TZ=America/New_York date +%F)" || echo "nothing to commit"
          git push

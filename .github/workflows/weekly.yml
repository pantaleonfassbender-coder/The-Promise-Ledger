name: Weekly ledger

# Mondays 12:00 UTC = 8:00 a.m. EDT / 7:00 a.m. EST, so the run finishes before 9:00 a.m. US Eastern even when
# GitHub starts scheduled jobs late. Every run appends a line to site/data/history.jsonl and commits, which also
# keeps the schedule from being disabled for inactivity.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-ledger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5 xlrd==2.0.1
      - name: Fetch, evaluate, write
        run: python scripts/run.py
      - name: Commit
        if: always()
        run: |
          git config user.name "promise-ledger bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          git commit -m "Weekly run $(TZ=America/New_York date +%F)" || echo "nothing to commit"
          git push
